name: PR Guard — Prevent modify/delete
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  block-modify-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
          git diff --name-status origin/${{ github.event.pull_request.base.ref }}...${{ github.sha }} > /tmp/changes || true
          if grep -E "^[MD]" /tmp/changes; then echo "::error::MODIFY/DELETE detected"; exit 1; fi
